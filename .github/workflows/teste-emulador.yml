name: Telas no emulador

# Teste visual num Android virtual. Não assina, não publica nada e não usa segredos.
on:
  push:
    branches: [teste-emulador]

permissions:
  contents: read

jobs:
  telas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Liberar a aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compilar o app de teste
        run: gradle testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-daemon
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          script: bash .github/fotografar.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telas
          path: telas/
