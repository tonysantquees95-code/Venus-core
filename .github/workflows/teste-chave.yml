name: Teste da troca de chave

# Ensaio da troca de chave com uma chave descartável (nada é guardado): cria, faz a linhagem,
# assina o último Venus.apk e confere que ele aceita as duas chaves.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  ensaio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensaiar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SENHA="ensaio-$(openssl rand -hex 8)"
          export SENHA
          gh release download --repo "$GITHUB_REPOSITORY" --pattern Venus.apk --dir "$RUNNER_TEMP"
          keytool -genkeypair -keystore "$RUNNER_TEMP/nova.keystore" -storetype PKCS12 -alias venus -keyalg RSA -keysize 4096 \
            -validity 10000 -storepass "$SENHA" -keypass "$SENHA" -dname "CN=Ensaio" > /dev/null 2>&1
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "build-tools: $BT"
          "$BT/apksigner" rotate --out "$RUNNER_TEMP/linhagem.bin" \
            --old-signer --ks app/sexta.keystore --ks-pass pass:sextafeira --ks-key-alias sexta --key-pass pass:sextafeira \
            --new-signer --ks "$RUNNER_TEMP/nova.keystore" --ks-pass env:SENHA --ks-key-alias venus --key-pass env:SENHA
          "$BT/apksigner" lineage --in "$RUNNER_TEMP/linhagem.bin" --print-certs | grep -iE "signer|SHA-256" || true
          "$BT/apksigner" sign \
            --ks app/sexta.keystore --ks-pass pass:sextafeira --ks-key-alias sexta --key-pass pass:sextafeira \
            --next-signer --ks "$RUNNER_TEMP/nova.keystore" --ks-pass env:SENHA --ks-key-alias venus --key-pass env:SENHA \
            --lineage "$RUNNER_TEMP/linhagem.bin" --rotation-min-sdk-version 28 "$RUNNER_TEMP/Venus.apk"
          "$BT/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/Venus.apk" | grep -E "Verified using|Signer|certificate SHA-256|Number of signers" | head -20
          echo "ENSAIO_OK"
