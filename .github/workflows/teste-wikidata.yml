name: Teste Wikidata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/teste-wikidata.yml"]

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Endpoints do painel da loja
        run: |
          mkdir -p out
          python3 - <<'PY'
          import re, urllib.request
          S = "https://desejo-de-intimidade.floot.app"
          def get(u):
              try:
                  return urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=20).read().decode("utf-8", "replace")
              except Exception as e:
                  return ""
          html = get(S + "/") + get(S + "/admin")
          fila = set(re.findall(r'(?:src|href)="([^"]+\.js)"', html))
          vistos = {}
          while fila and len(vistos) < 300:
              u = fila.pop()
              if u in vistos: continue
              url = u if u.startswith("http") else S + (u if u.startswith("/") else "/" + u)
              t = get(url)
              vistos[u] = t
              base = u.rsplit("/", 1)[0] if "/" in u else ""
              for m in re.findall(r'["\'](\.{0,2}/[A-Za-z0-9_./-]+\.js)["\']', t):
                  if m.startswith("./"): m = base + m[1:]
                  elif m.startswith("../"): m = base.rsplit("/", 1)[0] + m[2:]
                  if m not in vistos: fila.add(m)
          tudo = "\n".join(vistos.values())
          open("out/qtd.txt", "w").write(f"{len(vistos)} arquivos, {len(tudo)} bytes\n")
          eps = sorted(set(re.findall(r'_api/[A-Za-z0-9_/-]+', tudo)))
          open("out/endpoints.txt", "w").write("\n".join(eps))
          with open("out/contexto.txt", "w") as f:
              for m in re.finditer(r'_api/admin/[A-Za-z0-9_/-]+', tudo):
                  f.write("=== " + m.group(0) + "\n" + tudo[max(0, m.start() - 2500): m.end() + 300] + "\n\n")
          PY
          cat out/qtd.txt out/endpoints.txt
      - name: Guardar resultado num ramo separado
        run: |
          cd out
          git init -q -b diagnostico
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "diagnostico"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diagnostico
