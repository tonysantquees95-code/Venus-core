name: Teste Wikidata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/teste-wikidata.yml"]

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: API da loja
        run: |
          S=https://desejo-de-intimidade.floot.app
          r=$(curl -s -m 30 "$S/_api/catalog")
          echo "::notice::catalog $(echo "$r" | head -c 400 | tr '\n' ' ')"
          echo "::notice::catalog meta $(echo "$r" | jq -c '.meta' | head -c 300)"
          r=$(curl -s -m 30 -i -X POST "$S/_api/auth/login_with_password" -H 'Content-Type: application/json' -d '{"json":{"identifier":"teste@teste.invalid","password":"x"}}')
          echo "::notice::login $(echo "$r" | tr '\r\n' '  ' | head -c 500)"
          r=$(curl -s -m 30 -i "$S/_api/admin/orders")
          echo "::notice::orders $(echo "$r" | tr '\r\n' '  ' | head -c 400)"
