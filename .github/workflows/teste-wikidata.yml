name: Teste Wikidata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/teste-wikidata.yml"]

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Endpoints do painel da loja
        run: |
          mkdir -p out
          python3 - <<'PY'
          import re, urllib.request
          S = "https://desejo-de-intimidade.floot.app"
          def get(u):
              try:
                  return urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=20).read().decode("utf-8", "replace")
              except Exception as e:
                  return ""
          html = get(S + "/") + get(S + "/admin")
          fila = set(re.findall(r'(?:src|href)="([^"]+\.js)"', html))
          vistos = {}
          while fila and len(vistos) < 300:
              u = fila.pop()
              if u in vistos: continue
              url = u if u.startswith("http") else S + (u if u.startswith("/") else "/" + u)
              t = get(url)
              vistos[u] = t
              base = u.rsplit("/", 1)[0] if "/" in u else ""
              for m in re.findall(r'["\'](\.{0,2}/[A-Za-z0-9_./-]+\.js)["\']', t):
                  if m.startswith("./"): m = base + m[1:]
                  elif m.startswith("../"): m = base.rsplit("/", 1)[0] + m[2:]
                  if m not in vistos: fila.add(m)
          tudo = "\n".join(vistos.values())
          print("arquivos:", len(vistos))
          for marca in ["_api/venus/chat", "Atendimento da Vênus", "Dúvidas?", "VenusOrbe", "ponto de retirada", "Retirar na loja"]:
              print("::notice::", marca, "=>", "SIM" if marca in tudo else "nao")
          PY
          cat out/qtd.txt out/endpoints.txt
