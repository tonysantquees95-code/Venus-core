name: Site da Vênus (GitHub Pages)

# Publica a pasta site/ (site de vendas da Vênus) no GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conferir os scripts do site
        run: |
          for f in site/*.js; do node --check "$f"; done
      - name: Conferir que não há segredos no site
        run: |
          if grep -rEn "(APP_USR-|TEST-[0-9a-f]{8}|AIza[0-9A-Za-z_-]{20}|sk-[A-Za-z0-9]{20}|gsk_)" site; then echo "Achei algo que parece chave."; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: conferir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - id: pages
        uses: actions/deploy-pages@v4
