name: Apps web e APK (venus-apps)

# Compila os apps React/Capacitor da pasta venus-apps/: verificação (testes, tipos, web e PWA)
# e o APK de teste (debug) de cada app. Independente do app Kotlin e do servidor.
on:
  push:
    branches: [main]
    paths: ["venus-apps/**", ".github/workflows/venus-apps.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: venus-apps
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: venus-apps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: venus-apps/package-lock.json
      - run: npm ci
      - run: npm run verificar
      - name: Guardar o build web/PWA
        uses: actions/upload-artifact@v4
        with:
          name: venus-web-pwa
          path: venus-apps/apps/*/dist

  apk:
    needs: verificar
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [assistente, robo, dois-em-um]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: venus-apps/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Chave pública do selo de licença (embutida no aplicativo)
        run: |
          x=$(curl -fsS --retry 5 --retry-delay 5 https://venus-servidor.tonysantquees95.workers.dev/id/chave-publica | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!/^[A-Za-z0-9_-]{43}$/.test(j.x))process.exit(1);console.log(j.x)})')
          echo "VITE_SELO_CHAVE=$x" >> "$GITHUB_ENV"
      - name: Instalar
        working-directory: venus-apps
        run: npm ci
      - name: Preparar o projeto Android
        working-directory: venus-apps/apps/${{ matrix.app }}
        run: |
          npm run android:add
          npm run build:apk
      - name: Compilar o APK (teste)
        working-directory: venus-apps/apps/${{ matrix.app }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: venus-${{ matrix.app }}-apk
          path: venus-apps/apps/${{ matrix.app }}/android/app/build/outputs/apk/debug/*.apk

  windows:
    # App Windows (Electron): instalador e versão portátil. Reaproveita o build web do Dois em Um.
    needs: verificar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: venus-apps/package-lock.json
      - name: Chave pública do selo de licença (embutida no aplicativo)
        run: |
          x=$(curl -fsS --retry 5 --retry-delay 5 https://venus-servidor.tonysantquees95.workers.dev/id/chave-publica | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!/^[A-Za-z0-9_-]{43}$/.test(j.x))process.exit(1);console.log(j.x)})')
          echo "VITE_SELO_CHAVE=$x" >> "$GITHUB_ENV"
      - name: Instalar e gerar o app web (modo desktop)
        working-directory: venus-apps
        run: |
          npm ci
          npm run build:desktop -w @venus/dois-em-um
      - name: Gerar o instalador do Windows
        working-directory: venus-apps/desktop
        run: |
          # a versão instalada é o número do build (1.N.0): é com ela que o app sabe se tem atualização
          npm pkg set version=1.${{ github.run_number }}.0
          npm install --no-audit --no-fund
          npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: venus-windows
          path: |
            venus-apps/desktop/dist/*.exe

  publicar-windows:
    # Publica o instalador numa versão "win-1.N": é o que o Painel Dev e o link de download da Vênus entregam.
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: venus-windows
          path: exe
      - name: Publicar a versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la exe
          arq=$(ls exe/*.exe | head -n 1)
          cp "$arq" "exe/VenusSetup.exe"
          gh release create "win-1.${{ github.run_number }}" exe/VenusSetup.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Vênus para Windows 1.${{ github.run_number }}" --notes "Instalador da Vênus para Windows."
