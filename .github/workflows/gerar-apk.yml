name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Testar os comandos locais
        run: |
          set -o pipefail
          gradle testDebugUnitTest --no-daemon 2>&1 | tee build.log

      - name: Compilar o APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee -a build.log

      - name: Mostrar erros
        if: failure()
        run: |
          grep -E "^e: " build.log | head -n 20 | while read -r linha; do echo "::error::$linha"; done || true
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            grep -o '<failure message="[^"]*"' "$f" | sed 's/<failure message="//; s/"$//' | head -n 20 |
              while read -r linha; do echo "::error::$linha"; done
          done
          grep -E "Could not|What went wrong|> |Caused by|Required by|Searched in" build.log | grep -v "^> Task" | head -n 40 |
            while read -r linha; do echo "::error::$linha"; done || true

      - name: Renomear o APK
        run: cp app/build/outputs/apk/release/app-release.apk SextaFeira.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Sexta-feira 1.${{ github.run_number }}
          body: Baixe o arquivo SextaFeira.apk abaixo e toque nele para instalar.
          files: SextaFeira.apk
          make_latest: true
