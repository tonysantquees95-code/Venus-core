name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Testar os comandos locais
        run: |
          set -o pipefail
          gradle testSextaDebugUnitTest testVenusDebugUnitTest --no-daemon 2>&1 | tee build.log

      - name: Compilar o APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee -a build.log

      - name: Mostrar erros
        if: failure()
        run: |
          grep -E "^e: " build.log | head -n 20 | while read -r linha; do echo "::error::$linha"; done || true
          for f in app/build/test-results/*/*.xml; do
            [ -f "$f" ] || continue
            grep -o '<failure message="[^"]*"' "$f" | sed 's/<failure message="//; s/"$//' | head -n 20 |
              while read -r linha; do echo "::error::$linha"; done
          done
          grep -E "Could not|What went wrong|> |Caused by|Required by|Searched in" build.log | grep -v "^> Task" | head -n 40 |
            while read -r linha; do echo "::error::$linha"; done || true

      - name: Renomear os APKs
        run: |
          cp app/build/outputs/apk/sexta/release/app-sexta-release.apk SextaFeira.apk
          cp app/build/outputs/apk/venus/release/app-venus-release.apk Venus.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Sexta-feira e Vênus 1.${{ github.run_number }}
          body: "SextaFeira.apk = assistente pessoal. Venus.apk = assistente da loja. Toque no arquivo para instalar."
          files: |
            SextaFeira.apk
            Venus.apk
          make_latest: true
