name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar o APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renomear o APK
        run: cp app/build/outputs/apk/release/app-release.apk SextaFeira.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Sexta-feira 1.${{ github.run_number }}
          body: Baixe o arquivo SextaFeira.apk abaixo e toque nele para instalar.
          files: SextaFeira.apk
          make_latest: true
