name: Gerar APK

on:
  push:
    branches: [main]
    # só gera APK quando muda o app, o robô ou a compilação (servidor e documentos não gastam minutos do GitHub)
    paths:
      - "app/**"
      - "robo/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/gerar-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # O Gradle assina sempre com a chave antiga do repositório; se já existir a chave nova (segredos criados pela
      # rotina "Criar chave nova"), os APKs são assinados de novo, depois, com a chave nova + a linhagem.
      - name: Chave nova (segredos do GitHub)
        env:
          ASSINATURA_BASE64: ${{ secrets.ASSINATURA_BASE64 }}
          ASSINATURA_LINHAGEM: ${{ secrets.ASSINATURA_LINHAGEM }}
        run: |
          if [ -n "$ASSINATURA_BASE64" ] && [ -n "$ASSINATURA_LINHAGEM" ]; then
            echo "$ASSINATURA_BASE64" | base64 -d > "$RUNNER_TEMP/nova.keystore"
            echo "$ASSINATURA_LINHAGEM" | base64 -d > "$RUNNER_TEMP/linhagem.bin"
            echo "CHAVE_NOVA=sim" >> "$GITHUB_ENV"
            echo "Chave nova encontrada: os APKs vão sair com a chave nova e a linhagem."
          else
            echo "Ainda sem a chave nova: assinando com a chave do repositório."
          fi

      - name: Testar os comandos locais
        run: |
          set -o pipefail
          gradle testDebugUnitTest --no-daemon 2>&1 | tee build.log

      - name: Compilar o APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee -a build.log

      - name: Mostrar erros
        if: failure()
        run: |
          grep -E "^e: " build.log | head -n 20 | while read -r linha; do echo "::error::$linha"; done || true
          for f in app/build/test-results/*/*.xml; do
            [ -f "$f" ] || continue
            grep -o '<failure message="[^"]*"' "$f" | sed 's/<failure message="//; s/"$//' | head -n 20 |
              while read -r linha; do echo "::error::$linha"; done
          done
          grep -E "Could not|What went wrong|> |Caused by|Required by|Searched in" build.log | grep -v "^> Task" | head -n 40 |
            while read -r linha; do echo "::error::$linha"; done || true

      - name: Renomear os APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk Venus.apk
          cp robo/build/outputs/apk/release/robo-release.apk VenusRobo.apk

      # Assinatura v1/v2 com a chave antiga (Android 8) e v3 com a chave nova + linhagem (Android 9 em diante):
      # quem já tem a Vênus instalada recebe a atualização por cima, sem perder nada.
      - name: Assinar com a chave nova (linhagem)
        if: env.CHAVE_NOVA == 'sim'
        env:
          SENHA: ${{ secrets.ASSINATURA_SENHA }}
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          for apk in Venus.apk VenusRobo.apk; do
            "$BT/apksigner" sign \
              --ks app/sexta.keystore --ks-pass pass:sextafeira --ks-key-alias sexta --key-pass pass:sextafeira \
              --next-signer --ks "$RUNNER_TEMP/nova.keystore" --ks-pass env:SENHA --ks-key-alias venus --key-pass env:SENHA \
              --lineage "$RUNNER_TEMP/linhagem.bin" --rotation-min-sdk-version 28 "$apk"
            "$BT/apksigner" verify --verbose "$apk" | grep -E "Verified using|Number of signers" || true
          done
          shred -u "$RUNNER_TEMP/nova.keystore" "$RUNNER_TEMP/linhagem.bin"

      - name: Notas da versão
        run: |
          { git log -1 --format=%B | grep -v -i -e "^Co-Authored-By" -e "^Claude-Session" || true; echo; echo "Baixe o arquivo Venus.apk abaixo e toque nele para instalar. Ele atualiza a Vênus mantendo seus dados."; } > notas.txt

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Vênus 1.${{ github.run_number }}
          body_path: notas.txt
          files: Venus.apk
          make_latest: true

      # Só publica robô novo quando o código dele mudou; assim a Vênus não oferece atualização à toa.
      - name: O robô mudou?
        id: robo
        run: |
          ultima=$(git tag -l 'robo-1.*' --sort=-v:refname | head -n 1)
          if [ -z "$ultima" ] || ! git diff --quiet "$ultima" HEAD -- robo settings.gradle.kts build.gradle.kts; then
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          else
            echo "mudou=false" >> "$GITHUB_OUTPUT"
            echo "Robô igual ao $ultima: não publica de novo."
          fi

      - name: Publicar o Vênus Robô
        if: steps.robo.outputs.mudou == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: robo-1.${{ github.run_number }}
          name: Vênus Robô 1.${{ github.run_number }}
          body: "App que responde as clientes no WhatsApp Business e no Instagram com a Vênus da loja. Baixe o VenusRobo.apk e toque nele para instalar (é um app separado da Vênus)."
          files: VenusRobo.apk
          make_latest: false
